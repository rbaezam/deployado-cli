# GoReleaser configuration for Deployado CLI
# Docs: https://goreleaser.com
#
# To release:
#   git tag cli-v0.1.0
#   git push origin cli-v0.1.0
#
# GoReleaser is triggered by GitHub Actions on cli-v* tags.

version: 2

project_name: deployado

builds:
  - id: deployado
    main: ./cmd/deployado
    binary: deployado
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none* # Only include the binary, no extra files

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: rbaezam
    name: deployado
  name_template: "CLI v{{ .Version }}"
  header: |
    ## Deployado CLI v{{ .Version }}

    ### Installation

    **Quick install (Mac & Linux):**
    ```
    curl -sSfL https://deployado.com/cli/install.sh | sh
    ```

    **Or download a binary below** for your platform.
  draft: false
  prerelease: auto
